<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blutdruck Rechner</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#000000"><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;padding:20px}.container{max-width:520px;margin:auto}.card{background:#111;border:1px solid #333;border-radius:24px;padding:24px}input{width:100%;padding:14px;border-radius:12px;border:1px solid #444;background:#222;color:#fff;font-size:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.avg-box{margin-top:20px;background:#222;padding:24px;border-radius:18px;border:2px solid #444;text-align:center}.avg-value{font-size:42px;font-weight:bold}.result{margin-top:20px;padding:20px;border-radius:20px;text-align:center;font-size:26px;font-weight:bold}.green{background:#15803d}.yellow{background:#eab308;color:#000}.red{background:#dc2626}</style></head><body><div class="container"><div class="card"><h1>🩺 Blutdruck-Rechner</h1><p>3 Messungen eingeben</p><div class="row"><input id=sys1 placeholder=SYS type=number><input id=dia1 placeholder=DIA type=number></div><div class="row"><input id=sys2 placeholder=SYS type=number><input id=dia2 placeholder=DIA type=number></div><div class="row"><input id=sys3 placeholder=SYS type=number><input id=dia3 placeholder=DIA type=number></div><div class=avg-box><div>Durchschnitt</div><div class=avg-value><span id=avgSys>-</span> / <span id=avgDia>-</span></div></div><div id=result class=result>Bitte Werte eingeben</div></div></div><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js')}const result=document.getElementById('result'),avgSysEl=document.getElementById('avgSys'),avgDiaEl=document.getElementById('avgDia');function update(){const s=[+sys1.value,+sys2.value,+sys3.value],d=[+dia1.value,+dia2.value,+dia3.value];if(s.includes(0)||d.includes(0)){return}let as=(s[0]+s[1]+s[2])/3,ad=(d[0]+d[1]+d[2])/3;avgSysEl.textContent=Math.round(as);avgDiaEl.textContent=Math.round(ad);if(as>135||ad>86){result.className='result red';result.innerHTML='🔴 1 Tablette'}else if(as>=125||ad>=81){result.className='result yellow';result.innerHTML='🟡 1/2 Tablette'}else{result.className='result green';result.innerHTML='🟢 Keine Tablette'}}document.querySelectorAll('input').forEach(i=>i.addEventListener('input',update));</script></body></html>
